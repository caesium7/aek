[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aekfc"
version = "0.2.2"
description = "A lightweight Python library to check AEK Athens F.C.'s next scheduled match."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "C Bartsocas" },
]
keywords = ["football", "soccer", "aek", "aek-athens", "fixtures"]
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com"

[tool.hatch.build.targets.wheel]
packages = ["src/aek"]
